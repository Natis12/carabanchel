<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Bungee+Inline&family=Londrina+Outline&family=Faster+One&family=Audiowide&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
  body { background: #0f172a; color: white; padding: 40px; font-family: sans-serif; }
  .font-monoton { font-family: 'Monoton', cursive; }
  .font-bungee { font-family: 'Bungee Inline', cursive; }
  .font-londrina { font-family: 'Londrina Outline', cursive; }
  .font-faster { font-family: 'Faster One', cursive; }
  
  /* CSS Multiline / Tri-line text effect using text-stroke and shadows on geometric font */
  .triline-css {
    font-family: 'Outfit', sans-serif;
    font-weight: 900;
    color: transparent;
    -webkit-text-stroke: 1.5px #ffffff;
    text-shadow: 
      0 0 0 transparent,
      inset 0 0 0 #ffffff;
    letter-spacing: 2px;
  }
  
  .box { margin-bottom: 30px; border-bottom: 1px solid #334155; padding-bottom: 20px; }
  h2 { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="box">
    <h2>1. Monoton (Google Fonts)</h2>
    <div class="font-monoton" style="font-size: 38px; letter-spacing: 3px;">99 LUFTBALLONS</div>
    <div class="font-monoton" style="font-size: 28px; letter-spacing: 2px; color: #34d399; margin-top: 10px;">ELEVACIONES FRONTALES</div>
    <div class="font-monoton" style="font-size: 28px; letter-spacing: 2px; color: #fbbf24; margin-top: 10px;">SENTADILLA ASISTIDA</div>
  </div>

  <div class="box">
    <h2>2. Bungee Inline (Google Fonts)</h2>
    <div class="font-bungee" style="font-size: 34px; letter-spacing: 2px;">99 LUFTBALLONS</div>
    <div class="font-bungee" style="font-size: 26px; color: #34d399; margin-top: 10px;">ELEVACIONES FRONTALES</div>
  </div>

  <div class="box">
    <h2>3. Londrina Outline</h2>
    <div class="font-londrina" style="font-size: 40px; letter-spacing: 2px;">99 LUFTBALLONS</div>
    <div class="font-londrina" style="font-size: 32px; color: #34d399; margin-top: 10px;">ELEVACIONES FRONTALES</div>
  </div>
</body>
</html>
